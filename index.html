<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Música</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <h1>Meu Player de Música</h1>
        </nav>
    </header>

    <main>
        <!-- Seção principal com a lista de músicas -->
        <section id="biblioteca">
            <h2>Minha Biblioteca</h2>
            <!-- Container onde as músicas serão renderizadas via JavaScript -->
            <div id="lista-de-musicas" class="grid-musicas">
                <!-- Cards de música serão inseridos aqui via JavaScript -->
            </div>
        </section>

        <!-- Player fixo na parte inferior -->
        <section id="player">
            <div class="info-musica">
                <img src="https://via.placeholder.com/60" alt="Capa do álbum" id="capa-atual">
                <div class="texto-musica">
                    <h3 id="titulo-atual">Selecione uma música</h3>
                    <p id="artista-atual">-</p>
                </div>
            </div>
            
            <div class="controles">
                <button id="btn-anterior">⏮️</button>
                <button id="btn-play">▶️</button>
                <button id="btn-proximo">⏭️</button>
            </div>
            
            <div class="volume">
                <span>🔊</span>
                <input type="range" id="volume-control" min="0" max="100" value="50">
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
